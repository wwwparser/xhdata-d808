name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # каждый понедельник: отчёт по онлайн-потокам в логе и пересборка сайта

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      # Только отчёт: сервер GitHub в США, часть российских потоков может не отдаваться
      # на зарубежный IP. Удалять мёртвые потоки — локальным прогоном с российского IP.
      - name: Report online streams (informational)
        continue-on-error: true
        run: |
          cp data/streams.json /tmp/streams.json
          python scripts/check_streams.py /tmp/streams.json | tail -40
      - name: Build data (data/*.json -> site/data/*.js)
        run: python scripts/build_data.py
      # Готовый HTML для поисковиков: таблицы и тексты уже в разметке, а не только в JS
      - name: Prerender pages
        run: python scripts/prerender.py site dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # Заявка на переобход: сообщаем Яндексу (IndexNow) об обновлённых страницах
      - name: Notify search engines (IndexNow)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          sleep 30
          python scripts/indexnow.py
